<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 175" width="240" height="175">
  <rect width="240" height="175" fill="#ffffff"/>
  <!-- Vỏ ổ đĩa cứng HDD -->
  <g transform="translate(45, 14)">
    <rect x="0" y="0" width="150" height="114" rx="10" fill="#334155" stroke="#0f172a" stroke-width="2.5"/>
    <rect x="6" y="6" width="138" height="102" rx="7" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
    <!-- Ốc vít 4 góc -->
    <circle cx="14" cy="14" r="3" fill="#64748b"/>
    <circle cx="136" cy="14" r="3" fill="#64748b"/>
    <circle cx="14" cy="100" r="3" fill="#64748b"/>
    <circle cx="136" cy="100" r="3" fill="#64748b"/>
    <!-- Đĩa từ (Platter) -->
    <circle cx="62" cy="56" r="40" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/>
    <circle cx="62" cy="56" r="32" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6 4"/>
    <!-- Trục quay (Spindle) -->
    <circle cx="62" cy="56" r="11" fill="#475569" stroke="#1e293b" stroke-width="2"/>
    <circle cx="62" cy="56" r="4" fill="#e2e8f0"/>
    <!-- Cần đọc/ghi (Actuator Arm) -->
    <circle cx="116" cy="82" r="12" fill="#475569" stroke="#1e293b" stroke-width="2"/>
    <path d="M 112 74 L 74 52 L 78 46 L 120 70 Z" fill="#0284c7" stroke="#0369a1" stroke-width="1.5"/>
    <circle cx="116" cy="82" r="5" fill="#94a3b8"/>
  </g>
  <text x="120" y="156" font-family="Arial, sans-serif" font-size="16" font-style="italic" fill="#334155" text-anchor="middle">Hình 1.3. Đĩa cứng</text>
</svg>
