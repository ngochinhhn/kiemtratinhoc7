    <script>
      (function () {
        try {
          var origDefineProperty = Object.defineProperty;
          var origReflectDefineProperty =
            typeof Reflect !== 'undefined' && Reflect.defineProperty
              ? Reflect.defineProperty
              : null;

          function patchDescriptor(target, prop, descriptor) {
            if (!descriptor || typeof descriptor !== 'object') {
              return descriptor;
            }
            var isWindowTarget =
              target === window ||
              target === globalThis ||
              (typeof Window !== 'undefined' && target === Window.prototype);

            if (
              isWindowTarget &&
              typeof descriptor.get === 'function' &&
              typeof descriptor.set !== 'function'
            ) {
              var originalGetter = descriptor.get;
              var overriddenValue = undefined;
              var hasOverriddenValue = false;
              return {
                configurable: true,
                enumerable: descriptor.enumerable !== false,
                get: function () {
                  return hasOverriddenValue
                    ? overriddenValue
                    : originalGetter.call(this);
                },
                set: function (val) {
                  if (typeof val === 'function' || val !== undefined) {
                    overriddenValue = val;
                    hasOverriddenValue = true;
                  }
                },
              };
            }

            if (
              typeof target === 'function' &&
              'value' in descriptor &&
              descriptor.configurable === undefined
            ) {
              return {
                configurable: true,
                writable:
                  descriptor.writable !== undefined ? descriptor.writable : true,
                enumerable: Boolean(descriptor.enumerable),
                value: descriptor.value,
              };
            }

            return descriptor;
          }

          Object.defineProperty = function (target, prop, descriptor) {
            return origDefineProperty.call(
              this,
              target,
              prop,
              patchDescriptor(target, prop, descriptor)
            );
          };

          if (origReflectDefineProperty) {
            Reflect.defineProperty = function (target, prop, descriptor) {
              return origReflectDefineProperty.call(
                this,
                target,
                prop,
                patchDescriptor(target, prop, descriptor)
              );
            };
          }

          // If window.fetch was already made getter-only before this script ran, make it writable
          var winDesc = origDefineProperty
            ? Object.getOwnPropertyDescriptor(window, 'fetch')
            : null;
          if (winDesc && winDesc.get && !winDesc.set && winDesc.configurable !== false) {
            Object.defineProperty(window, 'fetch', winDesc);
          }

          // Prevent third-party browser extension errors (chrome-extension://) from triggering app error overlays
          window.addEventListener(
            'error',
            function (event) {
              var src = String((event && event.filename) || '');
              var msg = String((event && event.message) || '');
              var stack = String(
                (event && event.error && event.error.stack) || ''
              );
              if (
                src.indexOf('chrome-extension://') === 0 ||
                stack.indexOf('chrome-extension://') !== -1 ||
                msg.indexOf('Cannot set property fetch') !== -1
              ) {
                event.stopImmediatePropagation();
                event.preventDefault();
              }
            },
            true
          );
        } catch (_e) {
          // Ignore environment restrictions
        }
      })();
